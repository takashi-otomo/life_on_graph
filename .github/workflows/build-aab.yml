name: Build signed AAB (manual)

# Google Play への初回手動アップロード用に、署名済み AAB を生成して成果物として
# ダウンロードできるようにする手動ワークフロー。Secrets (署名鍵) を使用するため、
# ローカルに鍵やパスワードを置かずに署名済みビルドを得られる。
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "versionCode (build number)。空なら run number を使用"
        required: false
        default: ""

env:
  FLUTTER_VERSION: "3.44.1"

jobs:
  build-aab:
    name: Build signed AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 が未設定です (docs/release.md)。"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Resolve build number
        id: bn
        run: |
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            echo "value=${{ github.event.inputs.build_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build App Bundle (signed)
        run: flutter build appbundle --release --build-number=${{ steps.bn.outputs.value }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
