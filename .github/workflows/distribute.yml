name: Release (App Distribution / Google Play)

# ブランチ戦略:
#   - develop へのマージ → テスト版を Firebase App Distribution の testers へ配信
#   - main    へのマージ → 製品版を App Distribution の production へ配信し、
#                          署名済み AAB を Google Play Console (production) へ公開
# リリースノートは git 履歴から自動生成する (tool/release_notes.sh)。
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# バージョン番号 (versionName) を pubspec に書き戻すため push 権限が必要。
permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.1"
  PACKAGE_NAME: dev.otomo.life_on_graph

jobs:
  # 必要な Secret が未登録の間はジョブをスキップし、設定前の push で赤色失敗にしない。
  guard:
    name: Check release config
    runs-on: ubuntu-latest
    outputs:
      firebase: ${{ steps.c.outputs.firebase }}
      signing: ${{ steps.c.outputs.signing }}
      play: ${{ steps.c.outputs.play }}
    steps:
      # Secret は env 経由で参照する (JSON 鍵を run に直接展開しない / インジェクション回避)。
      - id: c
        env:
          FB_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FB_APP: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
        run: |
          firebase=false; signing=false; play=false
          [ -n "$FB_SA" ] && [ -n "$FB_APP" ] && firebase=true
          # 署名は keystore + 全パスワード/エイリアスが揃って初めて有効。
          [ -n "$KS_B64" ] && [ -n "$KS_PW" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PW" ] && signing=true
          [ -n "$PLAY_SA" ] && play=true
          echo "firebase=$firebase" >> "$GITHUB_OUTPUT"
          echo "signing=$signing" >> "$GITHUB_OUTPUT"
          echo "play=$play" >> "$GITHUB_OUTPUT"
          echo "::notice::firebase=$firebase signing=$signing play=$play (docs/release.md)"

  # この commit が既に main 上にあるか判定する。develop→main 昇格後の同期 (sync-back) で
  # 同一 commit が develop へ push された場合に、testers への二重配信を避けるため。
  testers-gate:
    name: Check testers eligibility
    needs: guard
    if: github.ref_name == 'develop' && needs.guard.outputs.firebase == 'true'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: c
        run: |
          git fetch origin main --quiet 2>/dev/null || true
          # develop の内容が main と同一 (= 新規変更なし) なら配信不要。fast-forward でも
          # マージコミットでの sync-back でも検出できるよう、ツリー差分で判定する。
          if git diff --quiet origin/main HEAD 2>/dev/null; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::develop は main と同一内容のため testers 配信をスキップ (二重配信防止)。"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # develop → テスター配信
  distribute-testers:
    name: Distribute to testers (develop)
    needs: [guard, testers-gate]
    if: >-
      github.ref_name == 'develop' &&
      needs.guard.outputs.firebase == 'true' &&
      needs.testers-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # リリースノート生成のため全履歴を取得
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      # テスト通過時のみ配信する。
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      # テスト通過後にパッチバージョンを +1 し、pubspec を develop へ書き戻す ([skip ci]
      # で再トリガを防止)。ビルドはこの更新後のワークツリーを使う。
      - name: Bump patch version (develop)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEW="$(bash tool/bump_version.sh develop)"
          git commit -m "chore(release): bump version to ${NEW} [skip ci]" pubspec.yaml
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "::notice::develop の versionName を ${NEW} に更新しました。"
      - name: Generate release notes
        run: bash tool/release_notes.sh
      - run: flutter build apk --release
      - name: Upload to Firebase App Distribution (testers)
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          releaseNotesFile: release_notes.txt
          file: build/app/outputs/flutter-apk/app-release.apk

  # main → 製品配信 + Google Play 本番公開。
  # production への配信/公開はデバッグ署名を避けるため署名必須とする。
  release-production:
    name: Release to production (main)
    needs: guard
    if: >-
      github.ref_name == 'main' &&
      needs.guard.outputs.firebase == 'true' &&
      needs.guard.outputs.signing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      # リリース: マイナーを +1 / パッチを 0 にして main へ書き戻す ([skip ci])。
      - name: Bump minor version (main release)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEW="$(bash tool/bump_version.sh main)"
          git commit -m "chore(release): bump version to ${NEW} [skip ci]" pubspec.yaml
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "::notice::main の versionName を ${NEW} に更新しました。"
      - name: Generate release notes
        run: bash tool/release_notes.sh

      # Play 公開する場合は、公開前に whatsnew (言語別最新情報) を検証して fail-fast する
      # (上限 500 字超・必須ロケール欠落・空ファイルを公開前に検出)。
      - name: Preflight whatsnew (Play)
        if: needs.guard.outputs.play == 'true'
        run: bash tool/check_whatsnew.sh

      # アップロード鍵 (keystore) を Secrets から復元する (job が signing 必須)。
      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # versionCode は build.gradle.kts が git コミット数から自動採番する (単調増加)。
      - name: Build APK (signed release)
        run: flutter build apk --release

      - name: Distribute to production (App Distribution)
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: production
          releaseNotesFile: release_notes.txt
          file: build/app/outputs/flutter-apk/app-release.apk

      # Play サービスアカウントが揃う場合のみ Google Play へ公開する。
      - name: Build App Bundle (signed)
        if: needs.guard.outputs.play == 'true'
        run: flutter build appbundle --release

      # 公開トラックとロールアウトは Repository variables で上書きできる (既定は
      # production / completed = 即時 100% 公開)。段階公開したい場合は Settings →
      # Secrets and variables → Actions → Variables に以下を設定する:
      #   PLAY_TRACK=production        (internal / alpha / beta / production)
      #   PLAY_STATUS=inProgress       (completed / inProgress / draft / halted)
      #   PLAY_USER_FRACTION=0.1       (status=inProgress のときの公開割合 0〜1)
      - name: Publish to Google Play
        if: needs.guard.outputs.play == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ vars.PLAY_TRACK || 'production' }}
          status: ${{ vars.PLAY_STATUS || 'completed' }}
          userFraction: ${{ (vars.PLAY_STATUS == 'inProgress' || vars.PLAY_STATUS == 'halted') && vars.PLAY_USER_FRACTION || '' }}
          whatsNewDirectory: distribution/whatsnew

      - name: Notice (Play publish skipped)
        if: needs.guard.outputs.play != 'true'
        run: echo "::warning::Play サービスアカウント(PLAY_SERVICE_ACCOUNT)が未設定のため Google Play 公開をスキップしました。App Distribution(production)のみ実施 (docs/release.md)。"

  # リリース後、main で確定したバージョンを develop へ引き継ぐ。
  carry-back-version:
    name: Carry version back to develop
    needs: release-production
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Sync develop versionName to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --quiet
          # main の確定 versionName を develop の pubspec に反映する (suffix は develop 側を維持)。
          MAIN_NAME="$(git show origin/main:pubspec.yaml | sed -n 's/^version:[[:space:]]*//p' | sed 's/+.*//')"
          cur="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)"
          suffix=""
          case "$cur" in *+*) suffix="+${cur#*+}" ;; esac
          perl -pi -e "s/^version:.*/version: ${MAIN_NAME}${suffix}/" pubspec.yaml
          if git diff --quiet; then
            echo "::notice::develop は既に ${MAIN_NAME} のため引き継ぎ不要。"
          else
            git commit -m "chore(release): sync version to ${MAIN_NAME} from main [skip ci]" pubspec.yaml
            git push origin develop
            echo "::notice::develop の versionName を ${MAIN_NAME} に引き継ぎました。"
          fi
