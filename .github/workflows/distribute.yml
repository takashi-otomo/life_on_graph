name: Release (App Distribution / Google Play)

# ブランチ戦略:
#   - develop へのマージ → テスト版を Firebase App Distribution の testers へ配信
#   - main    へのマージ → 製品版を App Distribution の production へ配信し、
#                          署名済み AAB を Google Play Console (production) へ公開
# リリースノートは git 履歴から自動生成する (tool/release_notes.sh)。
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.1"
  PACKAGE_NAME: dev.otomo.life_on_graph

jobs:
  # 必要な Secret が未登録の間はジョブをスキップし、設定前の push で赤色失敗にしない。
  guard:
    name: Check release config
    runs-on: ubuntu-latest
    outputs:
      firebase: ${{ steps.c.outputs.firebase }}
      signing: ${{ steps.c.outputs.signing }}
      play: ${{ steps.c.outputs.play }}
    steps:
      - id: c
        run: |
          firebase=false; signing=false; play=false
          [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ] && [ -n "${{ secrets.FIREBASE_ANDROID_APP_ID }}" ] && firebase=true
          [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && signing=true
          [ -n "${{ secrets.PLAY_SERVICE_ACCOUNT }}" ] && play=true
          echo "firebase=$firebase" >> "$GITHUB_OUTPUT"
          echo "signing=$signing" >> "$GITHUB_OUTPUT"
          echo "play=$play" >> "$GITHUB_OUTPUT"
          echo "::notice::firebase=$firebase signing=$signing play=$play (docs/release.md)"

  # develop → テスター配信
  distribute-testers:
    name: Distribute to testers (develop)
    needs: guard
    if: github.ref_name == 'develop' && needs.guard.outputs.firebase == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # リリースノート生成のため全履歴を取得
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      # テスト通過時のみ配信する。
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Generate release notes
        run: bash tool/release_notes.sh
      - run: flutter build apk --release
      - name: Upload to Firebase App Distribution (testers)
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          releaseNotesFile: release_notes.txt
          file: build/app/outputs/flutter-apk/app-release.apk

  # main → 製品配信 + Google Play 本番公開
  release-production:
    name: Release to production (main)
    needs: guard
    if: github.ref_name == 'main' && needs.guard.outputs.firebase == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Generate release notes
        run: bash tool/release_notes.sh

      # アップロード鍵 (keystore) を Secrets から復元する。
      - name: Decode upload keystore
        if: needs.guard.outputs.signing == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Distribute to production (App Distribution)
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: production
          releaseNotesFile: release_notes.txt
          file: build/app/outputs/flutter-apk/app-release.apk

      # 署名 + Play サービスアカウントが揃う場合のみ Google Play へ公開する。
      - name: Build App Bundle (signed)
        if: needs.guard.outputs.signing == 'true' && needs.guard.outputs.play == 'true'
        run: flutter build appbundle --release

      - name: Publish to Google Play (production)
        if: needs.guard.outputs.signing == 'true' && needs.guard.outputs.play == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: production
          status: completed
          whatsNewDirectory: distribution/whatsnew

      - name: Notice (Play publish skipped)
        if: needs.guard.outputs.signing != 'true' || needs.guard.outputs.play != 'true'
        run: echo "::warning::署名(ANDROID_KEYSTORE_BASE64)または Play サービスアカウント(PLAY_SERVICE_ACCOUNT)が未設定のため Google Play 公開をスキップしました (docs/release.md / #121)。"
