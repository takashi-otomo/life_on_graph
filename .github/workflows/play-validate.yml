name: Validate Google Play credentials (manual)

# main マージで自動公開する前に、PLAY_SERVICE_ACCOUNT が Google Play Developer API で
# 対象アプリへアクセスできるかを「変更を加えずに」検証する手動ワークフロー。
#
# 動作: edits.insert → tracks.list → edits.delete (破棄)。コミットしないため
# アプリの公開状態には一切影響しない。トラック一覧が取得できれば権限 OK。
#
# 失敗する主因:
#   - PLAY_SERVICE_ACCOUNT 未登録 / JSON 不正
#   - Play Console でサービスアカウントにアプリ権限を付与していない
#   - 対象パッケージのアプリが Play Console に未作成 (初回手動アップロード未実施)
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE_NAME: dev.otomo.life_on_graph

jobs:
  validate:
    name: Validate Play API access
    # 鍵 Secret を使うため保護ブランチからの実行のみ許可する。
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Guard (PLAY_SERVICE_ACCOUNT present)
        env:
          PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$PLAY_SA" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT が未登録です。docs/release.md の手順で登録してください。"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-api-python-client google-auth
      - name: Insert → list tracks → discard (no-op)
        env:
          PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
        run: |
          python - <<'PY'
          import json, os, sys
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError

          pkg = os.environ["PACKAGE_NAME"]
          info = json.loads(os.environ["PLAY_SA"])
          creds = service_account.Credentials.from_service_account_info(
              info, scopes=["https://www.googleapis.com/auth/androidpublisher"]
          )
          print(f"サービスアカウント: {info.get('client_email')}")
          svc = build("androidpublisher", "v3", credentials=creds, cache_discovery=False)
          try:
              edit = svc.edits().insert(packageName=pkg, body={}).execute()
              eid = edit["id"]
              tracks = svc.edits().tracks().list(packageName=pkg, editId=eid).execute()
              names = [t.get("track") for t in tracks.get("tracks", [])]
              svc.edits().delete(packageName=pkg, editId=eid).execute()  # 破棄 (no-op)
              print(f"✓ 認証・権限 OK。利用可能トラック: {names or '(まだリリースなし)'}")
          except HttpError as e:
              print(f"::error::Play API アクセス失敗: {e}")
              print("::error::SA へのアプリ権限付与、または初回手動アップロード(アプリ作成)を確認してください。")
              sys.exit(1)
          PY
